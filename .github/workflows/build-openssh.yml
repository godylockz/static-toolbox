name: OpenSSH

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build/**
      - package/targets/openssh/**
      - .github/workflows/build-openssh.yml
      - .github/workflows/reusable-build-linux.yml
  schedule:
    - cron: "47 3 * * 1"
  push:
    branches: [main]
    paths:
      - build/**
      - package/targets/openssh/**
      - .github/workflows/build-openssh.yml
      - .github/workflows/reusable-build-linux.yml

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      tool: openssh
