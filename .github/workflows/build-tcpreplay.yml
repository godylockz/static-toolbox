name: tcpreplay suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build/**
      - .github/workflows/build-tcpreplay.yml
      - .github/workflows/reusable-build-linux.yml
  schedule:
    - cron: "53 4 * * 1"
  push:
    branches: [main]
    paths:
      - build/**
      - .github/workflows/build-tcpreplay.yml
      - .github/workflows/reusable-build-linux.yml

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      tool: tcpreplay
