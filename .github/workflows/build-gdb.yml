name: GDB and gdbserver

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build/**
      - patches/gdb/**
      - .github/workflows/build-gdb.yml
      - .github/workflows/reusable-build-linux.yml
  schedule:
    - cron: "19 4 * * 1"
  push:
    branches: [main]
    paths:
      - build/**
      - patches/gdb/**
      - .github/workflows/build-gdb.yml
      - .github/workflows/reusable-build-linux.yml

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      tool: gdb
