name: Reusable Linux static build

on:
  workflow_call:
    inputs:
      tool:
        required: true
        type: string

jobs:
  metadata:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned version
        id: version
        run: |
          set -euo pipefail
          source build/versions.env
          case "${{ inputs.tool }}" in
            nmap) version=$NMAP_VERSION ;;
            tcpdump) version=$TCPDUMP_VERSION ;;
            openssh) version=$OPENSSH_VERSION ;;
            socat) version=$SOCAT_VERSION ;;
            gdb) version=$GDB_VERSION ;;
            strace) version=$STRACE_VERSION ;;
            tcpreplay) version=$TCPREPLAY_VERSION ;;
            *) printf 'Unknown tool: %s\n' "${{ inputs.tool }}" >&2; exit 2 ;;
          esac
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

  build:
    name: ${{ inputs.tool }} ${{ matrix.arch }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            image: ghcr.io/godylockz/static-toolbox-toolchain:x86-20261001@sha256:cdbe57a10501ad3deb81f5ea1dfb72af1eb789b757eb3287214a3e75e8570698
            triple: i686-unknown-linux-musl
          - arch: x86_64
            image: ghcr.io/godylockz/static-toolbox-toolchain:x86_64-20261001@sha256:37289863ab21cd6f7e3715eab9295604e1f6cca22ee02089024e5af2a5e60df2
            triple: x86_64-unknown-linux-musl
          - arch: armhf
            image: ghcr.io/godylockz/static-toolbox-toolchain:armhf-20261001@sha256:f2248d0232e3255d4f1341907887f0f68e8730bb2d2c068d34bac44e7b8faf82
            triple: arm-unknown-linux-musleabihf
          - arch: aarch64
            image: ghcr.io/godylockz/static-toolbox-toolchain:aarch64-20261001@sha256:36bfb56bc79093f5f285ef7a3d3ad47df951d4b4e4ad332d945932b380aa6420
            triple: aarch64-unknown-linux-musl
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build, validate, and package
        id: package
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          TOOL: ${{ inputs.tool }}
          TOOLCHAIN_IMAGE: ${{ matrix.image }}
          TOOLCHAIN_TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          build_directory="$RUNNER_TEMP/static-build"
          output_directory="$RUNNER_TEMP/static-output"
          package_directory="$RUNNER_TEMP/static-packages"
          mkdir -p "$build_directory" "$output_directory" "$package_directory"

          docker run --rm \
            -e ARCHITECTURE \
            -e GITHUB_SHA \
            -e GITHUB_WORKSPACE=/workspace \
            -e TOOL \
            -e TOOLCHAIN_IMAGE \
            -e TOOLCHAIN_TRIPLE \
            -e VERSION \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$build_directory:/build" \
            -v "$output_directory:/output" \
            -v "$package_directory:/packaged" \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            sh -lc '
              set -eu
              sh build/01_init.sh
              bash "build/targets/build_${TOOL}.sh" "$ARCHITECTURE"
              stage_directory="/output/${TOOL}-${VERSION}-linux-${ARCHITECTURE}"
              bash build/validate.sh "$TOOL" "$VERSION" "$ARCHITECTURE" "$stage_directory"
              bash build/package.sh "$TOOL" "$VERSION" "$ARCHITECTURE" "$stage_directory"
              archive="/packaged/${TOOL}-${VERSION}-linux-${ARCHITECTURE}-static.tar.gz"
              packaged_stage="/build/package-validation"
              mkdir "$packaged_stage"
              tar --extract --gzip --file "$archive" --directory "$packaged_stage"
              bash build/validate.sh "$TOOL" "$VERSION" "$ARCHITECTURE" \
                "$packaged_stage/${TOOL}-${VERSION}-linux-${ARCHITECTURE}"
            '

          {
            printf 'ARTIFACT_NAME=%s\n' "${TOOL}-${VERSION}-linux-${ARCHITECTURE}-static"
            printf 'ARTIFACT_PATH=%s\n' "$package_directory"
          } >>"$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.ARTIFACT_NAME }}
          path: ${{ steps.package.outputs.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release ${{ inputs.tool }} ${{ needs.metadata.outputs.version }}
    needs: [metadata, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/releases

      - name: Verify checksums
        working-directory: ${{ runner.temp }}/releases
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          checksum_files=(**/*.sha256)
          [[ ${#checksum_files[@]} -eq 4 ]]
          for checksum_file in "${checksum_files[@]}"; do
            (cd "$(dirname -- "$checksum_file")" && sha256sum --check "$(basename -- "$checksum_file")")
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/releases
          RELEASE_TAG: ${{ inputs.tool }}-v${{ needs.metadata.outputs.version }}
          RELEASE_TITLE: ${{ inputs.tool }} v${{ needs.metadata.outputs.version }} Linux static builds
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          release_files=("${RELEASE_DIRECTORY}"/**/*.tar.gz "${RELEASE_DIRECTORY}"/**/*.sha256)
          [[ ${#release_files[@]} -eq 8 ]]

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
          elif git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            gh release create "$RELEASE_TAG" "${release_files[@]}" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes "Pinned, musl-linked Linux builds for x86, x86_64, armhf, and aarch64. SHA-256 files are attached."
          else
            gh release create "$RELEASE_TAG" "${release_files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Pinned, musl-linked Linux builds for x86, x86_64, armhf, and aarch64. SHA-256 files are attached."
          fi
