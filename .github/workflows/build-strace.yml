name: strace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - build/**
      - .github/workflows/build-strace.yml
      - .github/workflows/reusable-build-linux.yml
  schedule:
    - cron: "37 4 * * 1"
  push:
    branches: [main]
    paths:
      - build/**
      - .github/workflows/build-strace.yml
      - .github/workflows/reusable-build-linux.yml

jobs:
  build:
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      tool: strace
